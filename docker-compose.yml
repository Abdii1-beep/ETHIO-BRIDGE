version: "3.9"

services:
  postgres:
    image: postgres:14-alpine
    container_name: ehio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ehio
      POSTGRES_PASSWORD: ehio_dev_password
      POSTGRES_DB: ehio_bridge
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehio -d ehio_bridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ehio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data: